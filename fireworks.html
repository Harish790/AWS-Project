<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Birthday Fireworks! 🎆</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0015;
      overflow: hidden;
      font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    }

    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    .message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      z-index: 10;
      animation: pulse 2.5s ease-in-out infinite;
    }

    .message h1 {
      font-size: clamp(2rem, 6vw, 4.5rem);
      font-weight: 900;
      color: #fff;
      text-shadow:
        0 0 10px #ff5c8a,
        0 0 30px #ff5c8a,
        0 0 60px #ff5c8a,
        0 0 80px #ff2d6b;
      letter-spacing: 2px;
      line-height: 1.2;
    }

    .message p {
      margin-top: 16px;
      font-size: clamp(1rem, 2.5vw, 1.6rem);
      color: #ffd36e;
      text-shadow:
        0 0 8px #ffd36e,
        0 0 20px #ffa500;
      font-weight: 700;
    }

    .emojis {
      font-size: clamp(1.8rem, 4vw, 3rem);
      margin-top: 12px;
      letter-spacing: 8px;
      animation: bounce 1.2s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      50%       { opacity: 0.85; transform: translate(-50%, -50%) scale(1.04); }
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-10px); }
    }

    .back-btn {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 12px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff5c8a, #ff8a3d);
      color: #fff;
      font-weight: 800;
      font-size: 1rem;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(255, 92, 138, 0.45);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .back-btn:hover {
      transform: translateX(-50%) translateY(-3px) scale(1.04);
      box-shadow: 0 14px 32px rgba(255, 92, 138, 0.55);
    }
  </style>
</head>
<body>

  <canvas id="birthday"></canvas>

  <div class="message">
    <h1>Happy Birthday! 🎂</h1>
    <p>Wishing you the most magical day ever ✨</p>
    <div class="emojis">🎆 🎇 🎉 🥳 🎈</div>
  </div>

  <a class="back-btn" href="index.html">← Back to Birthday Card</a>

  <script>
    (function () {
      const canvas = document.getElementById('birthday');
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      /* ── Particle ── */
      class Particle {
        constructor(x, y, color) {
          this.x = x;
          this.y = y;
          this.color = color;
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 6 + 1.5;
          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;
          this.alpha = 1;
          this.decay = Math.random() * 0.015 + 0.012;
          this.radius = Math.random() * 3 + 1.5;
          this.gravity = 0.12;
        }
        update() {
          this.vx *= 0.97;
          this.vy *= 0.97;
          this.vy += this.gravity;
          this.x  += this.vx;
          this.y  += this.vy;
          this.alpha -= this.decay;
        }
        draw() {
          ctx.save();
          ctx.globalAlpha = Math.max(this.alpha, 0);
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.shadowColor = this.color;
          ctx.shadowBlur  = 8;
          ctx.fill();
          ctx.restore();
        }
        isDead() { return this.alpha <= 0; }
      }

      /* ── Rocket ── */
      class Rocket {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = canvas.height;
          this.targetY = Math.random() * canvas.height * 0.5 + 60;
          this.speed = Math.random() * 4 + 6;
          this.color = randomColor();
          this.trail = [];
        }
        update() {
          this.trail.push({ x: this.x, y: this.y });
          if (this.trail.length > 12) this.trail.shift();
          this.y -= this.speed;
        }
        draw() {
          for (let i = 0; i < this.trail.length; i++) {
            const t = this.trail[i];
            const alpha = (i / this.trail.length) * 0.6;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.arc(t.x, t.y, 2, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.shadowColor = this.color;
            ctx.shadowBlur = 6;
            ctx.fill();
            ctx.restore();
          }
          ctx.save();
          ctx.beginPath();
          ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
          ctx.fillStyle = '#fff';
          ctx.shadowColor = this.color;
          ctx.shadowBlur = 12;
          ctx.fill();
          ctx.restore();
        }
        hasReached() { return this.y <= this.targetY; }
      }

      /* ── Helpers ── */
      const COLORS = [
        '#ff5c8a', '#ff8a3d', '#ffd36e', '#7fffb0',
        '#5ce1ff', '#c77dff', '#ff4dac', '#fff176',
        '#ff6b6b', '#4dd0e1', '#a5d6a7', '#ffab40',
      ];
      function randomColor() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }

      function explode(x, y) {
        const count  = Math.floor(Math.random() * 80 + 100);
        const color1 = randomColor();
        const color2 = randomColor();
        const parts  = [];
        for (let i = 0; i < count; i++) {
          parts.push(new Particle(x, y, Math.random() < 0.5 ? color1 : color2));
        }
        return parts;
      }

      /* ── State ── */
      let rockets   = [];
      let particles = [];

      function launchRocket() { rockets.push(new Rocket()); }

      setInterval(launchRocket, 600);
      launchRocket();

      /* ── Loop ── */
      function loop() {
        ctx.fillStyle = 'rgba(10, 0, 21, 0.22)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = rockets.length - 1; i >= 0; i--) {
          const r = rockets[i];
          r.update();
          r.draw();
          if (r.hasReached()) {
            particles.push(...explode(r.x, r.y));
            rockets.splice(i, 1);
          }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.update();
          p.draw();
          if (p.isDead()) particles.splice(i, 1);
        }

        requestAnimationFrame(loop);
      }

      loop();

      canvas.addEventListener('click', function (e) {
        particles.push(...explode(e.clientX, e.clientY));
      });
      canvas.addEventListener('touchstart', function (e) {
        const t = e.touches[0];
        particles.push(...explode(t.clientX, t.clientY));
      }, { passive: true });
    })();
  </script>
</body>
</html>
